name: Project checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --global pnpm@11.19.0
      - run: pnpm --dir frontend install --frozen-lockfile
      - run: pnpm --dir frontend test
      - run: pnpm --dir frontend build
      - run: python -m pip install --upgrade pip==26.2.1
      - run: python -m pip install -r requirements.txt httpx==0.28.1 pytest==9.1.1
      - run: python -m unittest tests.test_business_model tests.test_business_sources tests.test_business_exports -q
      - run: python -m pytest tests/test_native_workbook.py tests/test_native_uzgermed.py tests/test_native_documents.py tests/test_native_zuma_documents.py tests/test_native_teo.py tests/test_native_renderer.py tests/test_native_template_inputs.py -q
      - run: python -m unittest tests.test_business_projects -q
      - run: python -m unittest tests.test_business_templates -q
      - run: python tests/test_site.py
      - run: python tests/test_access.py
      - run: python -m unittest tests.test_future_reservations -q
      - run: python -m unittest tests.test_group_registration -q
      - run: python tests/test_bot_api.py
      - run: python -m unittest tests.test_report_archives -q
      - run: python -m unittest discover -s tests -p test_preview.py
      - run: python -m unittest discover -s tests -p test_open_site.py
      - run: python -m unittest discover -s tests -p test_render_start.py
      - run: python -m unittest discover -s tests -p test_check_bot_api.py
      - run: python -m unittest discover -s tests -p test_postgres_backup.py
      - run: docker build --tag uzgermed:check .
  postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: zuma_test
          POSTGRES_PASSWORD: synthetic-ci-password
          POSTGRES_DB: zuma_test_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U zuma_test -d zuma_test_ci"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg://zuma_test:synthetic-ci-password@127.0.0.1:5432/zuma_test_ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-tested.txt
      # Separate processes avoid the suites' temporary DATA_DIR cleanup affecting each other.
      - run: python tests/test_site.py
      - run: python tests/test_access.py
      - run: python tests/test_bot_api.py
      - run: python -m unittest tests.test_report_archives -q
      - run: python -m unittest tests.test_group_registration -q
      - run: python -m unittest tests.test_future_reservations -q
      - run: python -m unittest tests.test_business_projects -q
      - run: python -m unittest tests.test_business_templates -q

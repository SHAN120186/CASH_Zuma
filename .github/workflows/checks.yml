name: Project checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --global pnpm@11.19.0
      - run: pnpm --dir frontend install --frozen-lockfile
      - run: pnpm --dir frontend test
      - run: pnpm --dir frontend build
      - run: python -m pip install --upgrade pip==26.2.1
      - run: python -m pip install -r requirements.txt httpx==0.28.1 pytest==9.1.1
      - run: python -m unittest tests.test_business_model tests.test_business_sources tests.test_business_exports -q
      - run: python -m pytest tests/test_native_workbook.py tests/test_native_uzgermed.py tests/test_native_documents.py tests/test_native_zuma_documents.py tests/test_native_teo.py tests/test_native_renderer.py tests/test_native_toc.py tests/test_native_template_inputs.py -q
      - run: python -m unittest tests.test_business_projects -q
      - run: python -m unittest tests.test_business_templates -q
      - run: python tests/test_site.py
      - run: python -m unittest tests.test_request_delete -q
      - run: python -m unittest tests.test_cash_funding -q
      - run: python -m unittest tests.test_cash_funding_audit -q
      - run: python -m unittest tests.test_cash_funding_group_availability -q
      - run: python -m unittest tests.test_bank_cash_funding -q
      - run: python -m unittest tests.test_request_auto_archive -q
      - run: python -m unittest tests.test_request_due_order -q
      - run: python -m unittest tests.test_request_form_rules -q
      - run: python -m unittest tests.test_company_category_catalog -q
      - run: python -m unittest tests.test_request_batch_performance -q
      - run: python -m unittest tests.test_http_audit -q
      - run: python -m unittest tests.test_request_document_limit -q
      - run: python -m unittest tests.test_counterparty_name_migration -q
      - run: python -m unittest tests.test_counterparty_replace -q
      - run: python -m unittest tests.test_counterparty_remove_selected -q
      - run: python -m unittest tests.test_request_counterparty_lookup -q
      - run: python -m unittest tests.test_request_counterparty_inn -q
      - run: python -m unittest tests.test_request_foreign_inn -q
      - run: python -m unittest tests.test_department_catalog -q
      - run: python -m unittest tests.test_budget_import -q
      - run: python -m unittest tests.test_ledger_delete -q
      - run: python -m unittest tests.test_approval_funding -q
      - run: python -m unittest tests.test_director_limits -q
      - run: python -m unittest tests.test_cashflow_osv -q
      - run: python -m unittest tests.test_bank_statement_parser -q
      - run: python -m unittest tests.test_bank_statement_category_rules -q
      - run: python -m unittest tests.test_bank_statement_rule_allocation -q
      - run: python -m unittest tests.test_bank_rule_allocation_audit -q
      - run: python -m unittest tests.test_bank_statement_api -q
      - run: python -m unittest tests.test_bank_statement_resume -q
      - run: python -m unittest tests.test_bank_statement_fact_bridge -q
      - run: python -m unittest tests.test_bank_partial_posting -q
      - run: python -m unittest tests.test_bank_partial_fact -q
      - run: python -m unittest tests.test_bank_statement_historical_transfers tests.test_bank_statement_historical_requests tests.test_bank_statement_distinct_income tests.test_bank_dispute_lifecycle -q
      - run: python -m unittest tests.test_bank_statement_charges -q
      - run: python -m unittest tests.test_bank_statement_charge_integration -q
      - run: python -m unittest tests.test_bank_statement_interest_lifecycle -q
      - run: |
          for suite in test_bank_statement_actual_payments test_bank_statement_approved_preview test_bank_statement_auto_integration test_bank_statement_delete test_bank_statement_duplicates test_bank_statement_existing test_bank_statement_expenses test_bank_statement_fees test_bank_statement_guard test_bank_statement_history test_bank_statement_incoming test_bank_statement_reprocess_payments test_bank_statement_transfers test_bank_statement_unallocated_out test_unallocated_cashflow test_unallocated_expense_plan; do
            python -m unittest "tests.$suite" -q || exit $?
          done
      - run: python -m unittest tests.test_section_access -q
      - run: python tests/test_access.py
      - run: python -m unittest tests.test_role_downloads -q
      - run: python -m unittest tests.test_future_reservations -q
      - run: python -m unittest tests.test_group_registration -q
      - run: python tests/test_bot_api.py
      - run: python -m unittest tests.test_group_daily_summary -q
      - run: python -m unittest tests.test_report_archives -q
      - run: python -m unittest tests.test_financial_statements tests.test_financial_statement_calculations tests.test_financial_reconciliation -q
      - run: python -m unittest tests.test_ifrs_rating -q
      - run: python -m unittest discover -s tests -p test_preview.py
      - run: python -m unittest discover -s tests -p test_open_site.py
      - run: python -m unittest discover -s tests -p test_render_start.py
      - run: python -m unittest discover -s tests -p test_check_bot_api.py
      - run: python -m unittest discover -s tests -p test_postgres_backup.py
      - run: docker build --tag uzgermed:check .
  postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: zuma_test
          POSTGRES_PASSWORD: synthetic-ci-password
          POSTGRES_DB: zuma_test_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U zuma_test -d zuma_test_ci"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg://zuma_test:synthetic-ci-password@127.0.0.1:5432/zuma_test_ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-tested.txt
      # Separate processes avoid the suites' temporary DATA_DIR cleanup affecting each other.
      - run: python tests/test_site.py
      - run: python -m unittest tests.test_request_delete -q
      - run: python -m unittest tests.test_cash_funding -q
      - run: python -m unittest tests.test_cash_funding_audit -q
      - run: python -m unittest tests.test_cash_funding_group_availability -q
      - run: python -m unittest tests.test_bank_cash_funding -q
      - run: python -m unittest tests.test_request_auto_archive -q
      - run: python -m unittest tests.test_request_due_order -q
      - run: python -m unittest tests.test_request_form_rules -q
      - run: python -m unittest tests.test_company_category_catalog -q
      - run: python -m unittest tests.test_request_batch_performance -q
      - run: python -m unittest tests.test_director_limits -q
      - run: python -m unittest tests.test_http_audit -q
      - run: python -m unittest tests.test_request_document_limit -q
      - run: python -m unittest tests.test_counterparty_name_migration -q
      - run: python -m unittest tests.test_counterparty_replace -q
      - run: python -m unittest tests.test_counterparty_remove_selected -q
      - run: python -m unittest tests.test_request_counterparty_lookup -q
      - run: python -m unittest tests.test_request_counterparty_inn -q
      - run: python -m unittest tests.test_request_foreign_inn -q
      - run: python -m unittest tests.test_department_catalog -q
      - run: python -m unittest tests.test_budget_import -q
      - run: python -m unittest tests.test_ledger_delete -q
      - run: python -m unittest tests.test_approval_funding -q
      - run: python -m unittest tests.test_cashflow_osv -q
      - run: python -m unittest tests.test_bank_statement_parser -q
      - run: python -m unittest tests.test_bank_statement_category_rules -q
      - run: python -m unittest tests.test_bank_statement_rule_allocation -q
      - run: python -m unittest tests.test_bank_rule_allocation_audit -q
      - run: python -m unittest tests.test_bank_statement_api -q
      - run: python -m unittest tests.test_bank_statement_resume -q
      - run: python -m unittest tests.test_bank_statement_fact_bridge -q
      - run: python -m unittest tests.test_bank_partial_posting -q
      - run: python -m unittest tests.test_bank_partial_fact -q
      - run: python -m unittest tests.test_bank_statement_historical_transfers tests.test_bank_statement_historical_requests tests.test_bank_statement_distinct_income tests.test_bank_dispute_lifecycle -q
      - run: python -m unittest tests.test_bank_statement_charges -q
      - run: python -m unittest tests.test_bank_statement_charge_integration -q
      - run: python -m unittest tests.test_bank_statement_interest_lifecycle -q
      - run: |
          for suite in test_bank_statement_actual_payments test_bank_statement_approved_preview test_bank_statement_auto_integration test_bank_statement_delete test_bank_statement_duplicates test_bank_statement_existing test_bank_statement_expenses test_bank_statement_fees test_bank_statement_guard test_bank_statement_history test_bank_statement_incoming test_bank_statement_reprocess_payments test_bank_statement_transfers test_bank_statement_unallocated_out test_unallocated_cashflow test_unallocated_expense_plan; do
            python -m unittest "tests.$suite" -q || exit $?
          done
      - run: python -m unittest tests.test_section_access -q
      - run: python tests/test_access.py
      - run: python -m unittest tests.test_role_downloads -q
      - run: python tests/test_bot_api.py
      - run: python -m unittest tests.test_group_daily_summary -q
      - run: python -m unittest tests.test_report_archives -q
      - run: python -m unittest tests.test_financial_statements tests.test_financial_statement_calculations tests.test_financial_reconciliation -q
      - run: python -m unittest tests.test_ifrs_rating -q
      - run: python -m unittest tests.test_group_registration -q
      - run: python -m unittest tests.test_future_reservations -q
      - run: python -m unittest tests.test_business_projects -q
      - run: python -m unittest tests.test_business_templates -q

# Free web only. Use an existing Neon Free PostgreSQL database; no expiring Render DB.
services:
  - type: web
    name: uzgermed
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./Dockerfile
    autoDeployTrigger: off
    # Liveness does not poll Neon and keep its free compute awake continuously.
    # Startup checks the database before opening the listening socket.
    healthCheckPath: /health
    envVars:
      - key: UZGERMED_HOSTING
        value: render
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: COOKIE_SECURE
        value: "1"
      - key: TZ
        value: Asia/Tashkent

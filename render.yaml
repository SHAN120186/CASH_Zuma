# Free web only. Use an existing Neon Free PostgreSQL database; no expiring Render DB.
services:
  - type: web
    name: uzgermed
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./Dockerfile
    autoDeployTrigger: off
    # Liveness does not poll Neon and keep its free compute awake continuously.
    # Startup checks the database before opening the listening socket.
    healthCheckPath: /health
    envVars:
      - key: UZGERMED_HOSTING
        value: render
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: COOKIE_SECURE
        value: "1"
      - key: TZ
        value: Asia/Tashkent
      # Telegram bot API (Cash_Zuma_Bot). Without both values the bot API answers 503.
      - key: BOT_CLIENT_ID
        sync: false
      # At least 32 random characters; the bot uses the same value as CASH_ZUMA_BOT_CLIENT_SECRET.
      - key: BOT_CLIENT_SECRET
        sync: false
      # "-1001234567890:UZGERMED,ZUMA" — groups allowed to receive the morning summary.
      - key: BOT_REPORT_GROUPS
        sync: false
      - key: TELEGRAM_BOT_USERNAME
        sync: false
